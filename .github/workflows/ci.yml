# Builds packages and runs release, flake, CLI, shell, initializer, and recipe
# checks. Runs for pull requests, pushes to main, and nightly. A release job can
# call reusable workflow only after trusted main push passes `check`.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # nightly regression coverage of pinned inputs/builds

# Read-only repository access for the whole workflow; only the gated
# `release` caller job grants contents: write (to the reusable release
# workflow) and only from a trusted push to main.
permissions:
  contents: read

# Cancel in-progress pull request runs when a new revision arrives. Do not
# cancel main runs because a release job could be publishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: qarnet
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # Release contract check: strict-SemVer release.json must
      # match the changelog table row/body (with `## [Unreleased]` above the
      # current release), and the release regression suite proves every
      # negative contract element. Runs before the flake gate; the same check
      # is wired into the flake as checks.<system>.release-consistency.
      - name: Validate release and changelog consistency
        run: |
          python3 scripts/release.py check
          python3 tests/unit/test_release.py

      # Evaluate flake outputs and checks. First verify that every published
      # system output evaluates without building. Then realize normal checks,
      # including treefmt, pre-commit, and fake-boundary bootstrap tests. No
      # test downloads an SDK or toolchain.
      - name: Flake check
        run: |
          nix flake check --all-systems --no-build -L
          nix flake check -L

      # Build all packages. Cachix caches later runs.
      # openocd-master is ~10 min from source on first run; subsequent runs pull from cache.
      # nrfutil pulls segger-jlink-headless (SEGGER license accepted in the flake config).
      # nrf-probes is not a package: probe identification is the internal
      # `nix-nrf probes` subcommand, built as part of .#nix-nrf.
      # .#udev-rules is the OpenOCD udev-rule relocation package consumed by
      # the NixOS module and reported by `nix-nrf doctor`.
      # .#west-zephyr-sdk-v3_3_0 is the west backend exact Zephyr SDK package
      # (packages.default aliases nix-nrf, so it is not built separately).
      - name: Build packages
        run: nix build -L .#openocd-master-unwrapped .#openocd-master .#nrfutil .#nix-nrf .#udev-rules .#west-zephyr-sdk-v3_3_0

      # Smoke-run built binaries.
      - name: Smoke run openocd
        run: nix run .#openocd-master -- --version
      - name: Smoke run nrfutil
        run: nix run .#nrfutil -- --version
      - name: Smoke run nix-nrf help
        run: nix run .#nix-nrf -- --help
      # nix-nrf --version reports the project version from release.json,
      # independent from the selected NCS version.
      - name: Smoke run nix-nrf version
        run: nix run .#nix-nrf -- --version
      # nix-nrf versions delegates to `nrfutil sdk-manager search`; --help only,
      # so normal PR CI never depends on live Nordic index availability.
      - name: Smoke run nix-nrf versions help
        run: nix run .#nix-nrf -- versions --help
      - name: Smoke run nix-nrf probes help
        run: nix run .#nix-nrf -- probes --help
      # nix-nrf bootstrap delegates to the internal bootstrap module; --help
      # only, so normal PR CI never installs or downloads SDK/toolchain
      # bundles. Fake-boundary tests cover missing and install paths in the
      # `bootstrap-tests` check.
      - name: Smoke run nix-nrf bootstrap help
        run: nix run .#nix-nrf -- bootstrap --help
      # nix-nrf doctor delegates to the internal doctor module; --help only,
      # so normal PR CI never depends on the hosted runner's USB state. All
      # classification and remediation paths are covered by fake-boundary
      # doctor-tests check.
      - name: Smoke run nix-nrf doctor help
        run: nix run .#nix-nrf -- doctor --help
      # Unknown subcommands must fail with exit code 2.
      - name: nix-nrf unknown subcommand exits 2
        run: |
          set +e
          nix run .#nix-nrf -- does-not-exist
          rc=$?
          set -e
          test "$rc" -eq 2

      # Enter repository shell and verify it provides tools. The removed
      # nrf-probes/nrf-sdk-versions commands must be absent. Fresh CI has no
      # stale environment, so `! command -v` is reliable. This runs only
      # `nix-nrf bootstrap --help` and `nix-nrf doctor --help`, never a bare
      # bootstrap, installation, or doctor run against missing state or USB.
      - name: Devshell provides tools
        run: nix develop --command sh -ceu 'command -v nrfutil; command -v nix-nrf; command -v openocd; command -v west; nix-nrf bootstrap --help >/dev/null; nix-nrf doctor --help >/dev/null; ! command -v nrf-probes; ! command -v nrf-sdk-versions'

      # Check that Nordic sdk-manager variables
      # do not poison non-toolchain tools (Node, Git, Python).
      # Uses the dedicated clean-env-test shell to exercise actual
      # shell-hook behavior and dynamic linking.
      - name: Clean environment regression gate
        run: |
          # shellcheck disable=SC2016
          nix develop .#clean-env-test --command sh -ceu '
            case "${LD_LIBRARY_PATH:-}" in *ncs/toolchains*) exit 1;; esac
            case "${PYTHONPATH:-}" in *ncs/toolchains*) exit 1;; esac
            case "${GIT_EXEC_PATH:-}" in *ncs/toolchains*) exit 1;; esac
            test -z "${PYTHONHOME:-}"
            nix --version
            node --version
            git --version
            python3 -c "import json"
          '

      # Real OpenOCD source-compat gate. OpenOCD sources and parses the
      # recipe Tcl before trying to open a probe, so syntax errors surface
      # distinctly from "no probe" errors. The impossible `adapter serial`
      # value guarantees the adapter-open stage fails after the scripts parse.
      # This is deterministic even when the hosted runner has a probe attached.
      # An unexpected exit 0
      # would mean the gate did not exercise the expected probe-open
      # boundary. Recipe proc semantics (command order, args, conditionals)
      # are owned by the checks.flash-recipe-tests flake check, not this gate.
      - name: Real OpenOCD source-compat nRF53 recipe
        run: |
          set +e
          nix run .#openocd-master -- \
            -f interface/cmsis-dap.cfg \
            -c "adapter serial __nix_nrf_source_compat_no_probe__" \
            -c "transport select swd" \
            -c "adapter speed 1000" \
            -f target/nordic/nrf53.cfg \
            -f tcl/nrf53_flash.tcl \
            -c init \
            -c shutdown > /tmp/nrf53.log 2>&1
          rc=$?
          cat /tmp/nrf53.log
          # Fail if the error is a Tcl/syntax error (not the expected no-probe error).
          if grep -qiE "syntax error|wrong # args|can't read|invalid command name" /tmp/nrf53.log; then
            echo "ERROR: Tcl parse error detected" >&2
            exit 1
          fi
          # Exit 0 means the adapter-open boundary was not reached: the
          # impossible serial must force a probe-open failure after the
          # scripts parsed.
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: expected non-zero probe-open failure, got exit 0" >&2
            exit 1
          fi
          echo "OK: real OpenOCD sourced the recipe; exit $rc was the expected probe-open failure"
      - name: Real OpenOCD source-compat nRF54L recipe
        run: |
          set +e
          nix run .#openocd-master -- \
            -f interface/cmsis-dap.cfg \
            -c "adapter serial __nix_nrf_source_compat_no_probe__" \
            -c "transport select swd" \
            -c "adapter speed 1000" \
            -f target/nordic/nrf54l.cfg \
            -f tcl/nrf54l_flash.tcl \
            -c init \
            -c shutdown > /tmp/nrf54l.log 2>&1
          rc=$?
          cat /tmp/nrf54l.log
          if grep -qiE "syntax error|wrong # args|can't read|invalid command name" /tmp/nrf54l.log; then
            echo "ERROR: Tcl parse error detected" >&2
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: expected non-zero probe-open failure, got exit 0" >&2
            exit 1
          fi
          echo "OK: real OpenOCD sourced the recipe; exit $rc was the expected probe-open failure"

      # Verify `nix run .#init-project` generates a working
      # flake with a concrete NCS release into a script-created temporary root
      # (never a fixed caller path), that the generated project evaluates
      # against the current checkout (path:$repo, read-only; nothing is
      # written back to the repository), and that its dev shell provides the
      # expected tools without the removed nrf-probes. The exact
      # `--ncs-version v3.3.0` keeps generation offline; the dev shell entry
      # runs only the read-only bootstrap check, so this step never installs
      # or downloads SDK/toolchain bundles.
      - name: Project init and generated-flake check
        run: |
          repo="$(pwd)"
          tmp_root="$(mktemp -d)"
          trap 'rm -rf -- "$tmp_root"' EXIT
          dest="$tmp_root/project"
          nix run .#init-project -- "$dest" \
            --backend nrfutil --ncs-version v3.3.0 --non-interactive
          nix flake check -L "path:$dest" --override-input nix-nrf-dev "path:$repo"
          nix develop "path:$dest" --override-input nix-nrf-dev "path:$repo" \
            --command sh -ceu 'command -v openocd; command -v nix-nrf; nix-nrf probes --help >/dev/null; nix-nrf bootstrap --help >/dev/null; ! command -v nrf-probes'

  # Release publication: only a trusted push to main, after the `check` job
  # above passed, may reach the privileged reusable release workflow. Pull
  # requests, schedules, and non-main refs skip this job entirely, so
  # PR-contributed content can never publish. The caller grants only
  # contents: write (for the tag/Release creation inside the reusable
  # workflow) and passes the immutable github.sha as the exact ref.
  release:
    name: Release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ github.sha }}
