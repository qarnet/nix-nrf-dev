# Hardware integration tests — runs on a self-hosted runner with CMSIS-DAP
# probes and nRF target boards attached. run.sh builds four NCS artifacts at
# runtime (nRF5340 CPUAPP/CPUNET, nRF54L15 blinky + FLPR bundle), validates
# their Intel HEX layouts, and byte-verifies every flash through the TCL
# recipes. Dispatch-only until a runner with the `nrf-hardware` label is
# registered.
#
# See tests/hardware/README.md for runner registration and security notes.
name: Hardware

on:
  workflow_dispatch:        # manual trigger only until stable
  # schedule:                # uncomment when stable to run nightly
  #   - cron: '0 2 * * *'

# Cancel in-progress runs on the same ref.
concurrency:
  group: hardware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardware:
    runs-on: [self-hosted, nrf-hardware]
    # Four clean NCS builds (two blinky + two empty-sample sysbuilds) plus
    # two-board flashing: 15 minutes was too tight for clean cold builds on
    # the self-hosted runner.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: qarnet
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Run hardware integration tests
        run: bash tests/hardware/run.sh
