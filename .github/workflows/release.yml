# Release — reusable trusted-main GitHub Release workflow for nix-nrf-dev.
#
# `workflow_call` ONLY: this workflow has no push/pull_request/schedule/
# workflow_dispatch trigger and cannot react to events by itself. The sole
# caller is the gated `release` job in ci.yml, reachable only from a trusted
# push to main after all normal CI checks pass — PRs and other refs can never
# publish.
#
# The nix-nrf-dev project version is independent from NCS versions: the
# canonical `release.json` strict-SemVer manifest is validated, the changelog
# contract is enforced, and the tag/Release name is `v<version>` at the exact
# prepared SHA. Idempotency: an already published non-draft release is a
# no-op regardless of the prepared SHA (later main commits keep the same
# manifest version until the next bump). An existing tag is never deleted,
# force-moved, or reused at a different SHA.
#
# Least privilege split:
#   prepare — contents: read. Checks out the exact ref (full history), runs
#     the real release consistency check, derives version/tag/SHA, and uploads
#     only the prepared notes file as a short-retention artifact.
#   publish — contents: write. Does NOT check out the repository and executes
#     NO project code: it downloads only the notes artifact and drives the
#     GitHub API via the `gh` CLI with GH_REPO/tag/SHA from env.
name: Release

on:
  workflow_call:
    inputs:
      ref:
        description: Resolved trusted SHA to release (from the trusted-main caller)
        required: true
        type: string
    outputs:
      version:
        description: Project version prepared by the release
        value: ${{ jobs.prepare.outputs.version }}

# Serialize ALL release runs repository-wide so concurrent pushes to
# different refs/versions cannot race on the same tag; never cancel an
# in-flight run (a cancelled publish would leave a half-finished draft/tag).
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # Fail closed before anything else: any manifest/changelog contract
      # violation stops the release.
      - name: Validate release and changelog consistency
        run: python3 scripts/release.py check

      - name: Extract version and tag
        id: version
        run: |
          VER="$(python3 scripts/release.py version)"
          echo "value=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Resolve checked-out SHA
        id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        run: python3 scripts/release.py notes --output "$RUNNER_TEMP/release-notes.md"

      - name: Upload release notes artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Download release notes artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes
          path: notes

      # No checkout, no repository code: only the prepared notes file plus
      # the gh CLI against the GitHub API.
      - name: Inspect release and tag state
        id: state
        run: |
          set -eu
          notes_path="notes/release-notes.md"
          [ -s "$notes_path" ] || { echo "::error::release notes artifact is missing or empty" >&2; exit 1; }
          echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"

          # One authenticated GraphQL query returns both the release and the
          # tag for the prepared tag name. Lookups are fail-closed: a gh/jq
          # error (HTTP, GraphQL, or transport), a missing `.data.repository`
          # node, or an unexpected field shape aborts the job; only explicit
          # null nodes mean absence. Query/schema verified against the live
          # GitHub API: repository.release(tagName:) -> { isDraft } | null,
          # repository.ref(qualifiedName:) -> { target { oid __typename } } |
          # null, with __typename "Commit" (lightweight tag at a commit) vs
          # "Tag" (annotated tag).
          query="$(cat <<'GQL'
          query ReleaseState($owner: String!, $name: String!, $tagName: String!, $qualifiedName: String!) {
            repository(owner: $owner, name: $name) {
              release(tagName: $tagName) {
                isDraft
              }
              ref(qualifiedName: $qualifiedName) {
                target {
                  oid
                  __typename
                }
              }
            }
          }
          GQL
          )"
          graphql="$(gh api graphql -f query="$query" \
            -F owner="${{ github.repository_owner }}" \
            -F name="${GH_REPO#*/}" \
            -F tagName="$TAG" \
            -F qualifiedName="refs/tags/$TAG")"

          repo_ok="$(printf '%s' "$graphql" | jq -r 'if (.data | type) == "object" and .data.repository != null then "ok" else "error" end')"
          [ "$repo_ok" = "ok" ] || { echo "::error::release state query returned no repository node (API/schema error?)" >&2; printf '%s\n' "$graphql" >&2; exit 1; }

          # Release classification with explicit null/isDraft branches: jq's
          # `//` fallback is never used, so a boolean false (published) can
          # not be mistaken for absence.
          release_class="$(printf '%s' "$graphql" | jq -r '
            if .data.repository.release == null then "absent"
            elif .data.repository.release.isDraft == true then "draft"
            elif .data.repository.release.isDraft == false then "published"
            else "error" end')"
          [ "$release_class" != "error" ] || { echo "::error::release state query returned an unexpected release shape" >&2; printf '%s\n' "$graphql" >&2; exit 1; }

          # Ref classification: "Commit" is a lightweight tag at a commit,
          # "Tag" is an annotated tag, "absent" is no tag; any other shape
          # fails closed.
          ref_class="$(printf '%s' "$graphql" | jq -r '
            if .data.repository.ref == null then "absent"
            elif (.data.repository.ref.target | type) != "object" then "error"
            else .data.repository.ref.target.__typename end')"
          [ "$ref_class" != "error" ] || { echo "::error::release state query returned an unexpected ref shape" >&2; printf '%s\n' "$graphql" >&2; exit 1; }
          ref_oid="$(printf '%s' "$graphql" | jq -r '.data.repository.ref.target.oid // empty')"

          # Idempotency first: a published non-draft release is a no-op even
          # when the tag sits at an older SHA (later main commits retain the
          # current manifest version until the next bump). The tag is never
          # inspected for mutation in that case.
          if [ "$release_class" = "published" ]; then
            echo "state=published" >> "$GITHUB_OUTPUT"
            echo "tag_at_prepared_sha=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only for a draft or absent release is the tag inspected before any
          # mutation. An annotated (non-commit) tag, or a lightweight tag at
          # any SHA other than the prepared SHA, fails closed — a tag is never
          # deleted, force-moved, or reused at the wrong commit. A lightweight
          # tag at the exact prepared SHA may be reused as-is.
          if [ "$ref_class" = "absent" ]; then
            echo "tag_at_prepared_sha=false" >> "$GITHUB_OUTPUT"
          elif [ "$ref_class" != "Commit" ]; then
            echo "::error::refs/tags/$TAG exists as a non-commit ($ref_class) tag; refusing to mutate it" >&2
            exit 1
          elif [ "$ref_oid" != "$SHA" ]; then
            echo "::error::refs/tags/$TAG already exists at $ref_oid, not the prepared SHA $SHA; refusing to move it" >&2
            exit 1
          else
            echo "tag_at_prepared_sha=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$release_class" = "draft" ]; then
            echo "state=draft" >> "$GITHUB_OUTPUT"
          else
            echo "state=none" >> "$GITHUB_OUTPUT"
          fi

      - name: No-op when already published
        if: steps.state.outputs.state == 'published'
        run: echo "Release $TAG already published — no-op."

      - name: Publish existing draft
        if: steps.state.outputs.state == 'draft'
        run: |
          gh release edit "$TAG" \
            --target "$SHA" \
            --title "$TAG" \
            --notes-file "${{ steps.state.outputs.notes_path }}" \
            --draft=false \
            --latest

      - name: Create published release
        if: steps.state.outputs.state == 'none'
        run: |
          # gh release create also creates the (lightweight) tag at the
          # exact target SHA; a pre-existing lightweight tag at that SHA is
          # reused, anything else was rejected above.
          gh release create "$TAG" \
            --target "$SHA" \
            --title "$TAG" \
            --notes-file "${{ steps.state.outputs.notes_path }}" \
            --latest
