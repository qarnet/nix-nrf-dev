# .typos.toml — typos spellchecker config (consumed by the git-hooks typos hook).
# Whitelist abbreviations used in TCL comment placeholders and tool names.
[default]
# Ignore git commit hashes (short and full) in prose: digit-split tokens like
# "ba" inside `bf8b2ba` are false positives.
extend-ignore-re = ["[0-9a-f]{7,40}"]

[default.extend-words]
SER = "SER" # serial-number placeholder in tcl usage examples
tio = "tio" # serial-console tool
